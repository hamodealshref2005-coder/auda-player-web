<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auda Player — Developer Page</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0a0a;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #121212;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    p {
      color: #a1a1aa;
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 18px;
    }
    .meta {
      font-size: 0.85rem;
      color: #d4d4d8;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px 14px;
      border-radius: 12px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }
    .link {
      display: inline-block;
      margin-top: 16px;
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Auda Player</h1>
    <p>Official developer page for Auda Player on Google Play.</p>
    <div class="meta">Package: com.alshref.audaplayer</div>
    <a class="link" href="./app-ads.txt">View app-ads.txt</a>
  </main>
</body>
</html>
